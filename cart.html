<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwiftCart | Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">🛒 SwiftCart</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html" class="active">Cart</a>
    <a href="profile.html">Profile</a>
    <a href="signup.html">Sign In</a>
    <a href="contact.html" class="active">Contact</a>
  </div>
</header>

<section class="cart-section">
  <h2>Your Shopping Cart</h2>
  <table class="cart-table">
    <tr>
      <th>Product</th><th>Price</th><th>Qty</th><th>Total</th>
    </tr>
    <tr class="cart-item" data-price="129">
      <td>Wireless Headphones</td>
      <td>₹129</td>
      <td>
        <div class="qty-controls">
          <button class="qty-btn minus">-</button>
          <input type="number" class="qty-input" value="2" min="1">
          <button class="qty-btn plus">+</button>
        </div>
      </td>
      <td class="item-total">₹258</td>
    </tr>
    <tr class="cart-item" data-price="699">
      <td>Smartphone X</td>
      <td>₹699</td>
      <td>
        <div class="qty-controls">
          <button class="qty-btn minus">-</button>
          <input type="number" class="qty-input" value="1" min="1">
          <button class="qty-btn plus">+</button>
        </div>
      </td>
      <td class="item-total">₹699</td>
    </tr>
  </table>
  <p><strong>Grand Total: ₹<span id="grand-total">957</span></strong></p>
  <a href="products.html" class="btn">Continue Shopping</a>
</section>



<script src="/script.js"></script>

</body>
</html>
